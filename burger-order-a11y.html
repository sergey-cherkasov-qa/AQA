<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Заказ бургера</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#fff;color:#111;font:16px/1.5 "Inter","Segoe UI",system-ui,sans-serif;padding:48px 20px}
main{max-width:560px;margin:0 auto}
h1{font-size:28px;font-weight:600;letter-spacing:-.02em;margin-bottom:32px;border-bottom:2px solid #111;padding-bottom:12px}
.field,fieldset{border:0;margin-bottom:28px}
label.title,legend{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:#666;margin-bottom:8px}
input[type=text],input[type=number],select{width:100%;padding:12px;border:1px solid #111;border-radius:0;font:inherit;background:#fff}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid #111;outline-offset:2px}
.options{display:flex;flex-wrap:wrap;gap:16px}
.options label{display:flex;align-items:center;gap:8px;cursor:pointer}
input[type=radio],input[type=checkbox]{accent-color:#111;width:18px;height:18px}
.switch{position:relative;display:inline-flex;align-items:center;gap:12px;cursor:pointer}
.switch input{position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0;cursor:pointer}
.track{width:44px;height:24px;border:1px solid #111;position:relative;transition:background .2s}
.track::before{content:"";position:absolute;width:18px;height:18px;left:2px;top:2px;background:#111;transition:transform .2s}
.switch input:checked+.track{background:#111}
.switch input:checked+.track::before{background:#fff;transform:translateX(20px)}
.counter{display:flex;max-width:180px}
.counter button{width:44px;border:1px solid #111;background:#fff;font-size:20px;cursor:pointer}
.counter button:disabled{color:#bbb;border-color:#bbb;cursor:not-allowed}
.counter input{text-align:center;border-left:0;border-right:0}
.actions{display:flex;gap:12px;margin-top:36px}
.actions button{padding:14px 24px;font:inherit;font-weight:600;border:1px solid #111;cursor:pointer}
.primary{background:#111;color:#fff}.secondary{background:#fff;color:#111}
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center}
.backdrop[hidden]{display:none}
[role=dialog]{background:#fff;border:2px solid #111;padding:32px;max-width:400px;width:90%}
[role=dialog] h2{font-size:22px;margin-bottom:12px}
[role=dialog] p{color:#444;margin-bottom:8px}
[role=dialog] button{margin-top:16px}
</style>
</head>
<body>
<main>
<h1>Заказ бургера</h1>
<form id="burgerForm" aria-label="Заказ бургера">

  <div class="field">
    <label class="title" for="customerName">Имя клиента</label>
    <input type="text" id="customerName" name="customerName" placeholder="Введите ваше имя" required>
  </div>

  <div class="field">
    <label class="title" for="burgerType">Тип бургера</label>
    <select id="burgerType" name="burgerType">
      <option value="classic">Классический</option>
      <option value="cheeseburger">Чизбургер</option>
      <option value="vegan">Веган</option>
      <option value="spicy">Острый</option>
    </select>
  </div>

  <fieldset>
    <legend>Размер порции</legend>
    <div class="options">
      <label><input type="radio" name="portionSize" value="small"> Маленький</label>
      <label><input type="radio" name="portionSize" value="medium" checked> Средний</label>
      <label><input type="radio" name="portionSize" value="large"> Большой</label>
    </div>
  </fieldset>

  <fieldset>
    <legend>Дополнительные ингредиенты</legend>
    <div class="options">
      <label><input type="checkbox" name="extra" value="mustard"> Горчица</label>
    </div>
  </fieldset>

  <div class="field">
    <label class="switch">
      <input type="checkbox" role="switch" name="takeaway">
      <span class="track" aria-hidden="true"></span>
      <span>Заказ с собой</span>
    </label>
  </div>

  <div class="field">
    <label class="title" for="quantity">Количество бургеров</label>
    <div class="counter">
      <button type="button" id="dec" aria-label="Уменьшить количество">−</button>
      <input type="number" id="quantity" name="quantity" value="1" min="1" max="10">
      <button type="button" id="inc" aria-label="Увеличить количество">+</button>
    </div>
  </div>

  <fieldset>
    <legend>Способ оплаты</legend>
    <div class="options">
      <label><input type="radio" name="paymentMethod" value="cash" checked> Наличными</label>
      <label><input type="radio" name="paymentMethod" value="card_online"> Картой онлайн</label>
    </div>
  </fieldset>

  <div class="actions">
    <button type="submit" class="primary">Заказать бургер</button>
    <button type="reset" class="secondary">Сбросить форму</button>
  </div>
</form>
</main>

<div class="backdrop" id="backdrop" hidden>
  <div role="dialog" aria-modal="true" aria-labelledby="popupTitle">
    <h2 id="popupTitle">Заказ принят</h2>
    <p id="popupMessage"></p>
    <p>Ваш заказ будет готов в течение 20–30 минут.</p>
    <button type="button" class="primary" id="close">Закрыть</button>
  </div>
</div>

<script>
const form=document.getElementById('burgerForm');
const qty=document.getElementById('quantity');
const dec=document.getElementById('dec'), inc=document.getElementById('inc');
const backdrop=document.getElementById('backdrop');
function clamp(){let v=parseInt(qty.value)||1;v=Math.min(10,Math.max(1,v));qty.value=v;dec.disabled=v<=1;inc.disabled=v>=10}
dec.onclick=()=>{qty.value=(parseInt(qty.value)||1)-1;clamp()};
inc.onclick=()=>{qty.value=(parseInt(qty.value)||1)+1;clamp()};
qty.addEventListener('input',clamp);
form.addEventListener('reset',()=>setTimeout(clamp));
form.addEventListener('submit',e=>{
  e.preventDefault();
  const name=new FormData(form).get('customerName').trim();
  if(!name){alert('Пожалуйста, введите имя клиента');return}
  document.getElementById('popupMessage').textContent=`Спасибо за заказ, ${name}!`;
  backdrop.hidden=false;document.getElementById('close').focus();
});
document.getElementById('close').onclick=()=>{backdrop.hidden=true};
backdrop.addEventListener('click',e=>{if(e.target===backdrop)backdrop.hidden=true});
clamp();
</script>
</body>
</html>
