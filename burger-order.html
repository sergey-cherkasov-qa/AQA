<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Заказ бургера</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#fff;color:#111;font:16px/1.5 "Inter","Segoe UI",system-ui,sans-serif;padding:48px 20px}
.container{max-width:560px;margin:0 auto}
.header h1{font-size:28px;font-weight:600;letter-spacing:-.02em;margin-bottom:32px;border-bottom:2px solid #111;padding-bottom:12px}
.form-group{margin-bottom:28px}
.form-group>label{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:#666;margin-bottom:8px}
.form-group input[type=text],.form-group select{width:100%;padding:12px;border:1px solid #111;border-radius:0;font:inherit;background:#fff}
input:focus,select:focus,button:focus{outline:2px solid #111;outline-offset:2px}
.radio-group,.checkbox-group{display:flex;flex-wrap:wrap;gap:16px}
.radio-group label,.checkbox-group label{display:flex;align-items:center;gap:8px;cursor:pointer}
input[type=radio],input[type=checkbox]{accent-color:#111;width:18px;height:18px}
/* SWITCH: инпут 0×0 — намеренно, для демо */
.switch-label{display:inline-flex;align-items:center;gap:12px;cursor:pointer;position:relative}
.switch-input{position:absolute;opacity:0;width:0;height:0}
.switch-slider{width:44px;height:24px;border:1px solid #111;position:relative;transition:background .2s}
.switch-slider:before{content:"";position:absolute;width:18px;height:18px;left:2px;top:2px;background:#111;transition:transform .2s}
.switch-input:checked+.switch-slider{background:#111}
.switch-input:checked+.switch-slider:before{background:#fff;transform:translateX(20px)}
.counter-input{display:flex;max-width:180px}
.counter-btn{width:44px;border:1px solid #111;background:#fff;font-size:20px;cursor:pointer}
.counter-btn:disabled{color:#bbb;border-color:#bbb;cursor:not-allowed}
#quantity{text-align:center;border-left:0;border-right:0}
.form-actions{display:flex;gap:12px;margin-top:36px}
.form-actions button,.popup-content button{padding:14px 24px;font:inherit;font-weight:600;border:1px solid #111;cursor:pointer}
.btn-primary{background:#111;color:#fff}.btn-secondary{background:#fff;color:#111}
.popup{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:1000}
.popup-content{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;border:2px solid #111;padding:32px;max-width:400px;width:90%}
.popup-content h2{font-size:22px;margin-bottom:12px}
.popup-content p{color:#444;margin-bottom:8px}
.popup-content button{margin-top:16px}
</style>
</head>
<body>
<div class="container">
  <div class="header"><h1>Заказ бургера</h1></div>
  <div class="content">
    <form class="order-form" id="burgerForm">

      <div class="form-group">
        <label for="customerName">Имя клиента:</label>
        <input type="text" id="customerName" name="customerName" placeholder="Введите ваше имя" required>
      </div>

      <div class="form-group">
        <label for="burgerType">Тип бургера:</label>
        <select id="burgerType" name="burgerType">
          <option value="classic">Классический</option>
          <option value="cheeseburger">Чизбургер</option>
          <option value="vegan">Веган</option>
          <option value="spicy">Острый</option>
        </select>
      </div>

      <div class="form-group">
        <label>Размер порции:</label>
        <div class="radio-group">
          <label><input type="radio" name="portionSize" value="small"> Маленький</label>
          <label><input type="radio" name="portionSize" value="medium" checked> Средний</label>
          <label><input type="radio" name="portionSize" value="large"> Большой</label>
        </div>
      </div>

      <div class="form-group">
        <label>Дополнительные ингредиенты:</label>
        <div class="checkbox-group">
          <label><input type="checkbox" name="extraMustard" value="mustard"> Горчица</label>
        </div>
      </div>

      <div class="form-group">
        <label>Заказ с собой:</label>
        <div class="switch-group">
          <label class="switch-label">
            <input type="checkbox" name="takeaway" class="switch-input">
            <span class="switch-slider"></span>
            <span class="switch-text">Да</span>
          </label>
        </div>
      </div>

      <div class="form-group">
        <label for="quantity">Количество бургеров:</label>
        <div class="counter-input">
          <button type="button" class="counter-btn counter-decrease" onclick="decreaseQuantity()">−</button>
          <input type="text" id="quantity" name="quantity" value="1">
          <button type="button" class="counter-btn counter-increase" onclick="increaseQuantity()">+</button>
        </div>
      </div>

      <div class="form-group">
        <label>Способ оплаты:</label>
        <div class="radio-group">
          <label><input type="radio" name="paymentMethod" value="cash" checked> Наличными</label>
          <label><input type="radio" name="paymentMethod" value="card_online"> Картой онлайн</label>
        </div>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn-primary">Заказать бургер</button>
        <button type="button" class="btn-secondary" onclick="resetForm()">Сбросить форму</button>
      </div>
    </form>
  </div>
</div>

<div class="popup" id="popup">
  <div class="popup-content">
    <h2>✅ Заказ принят!</h2>
    <p id="popupMessage">Спасибо за заказ!</p>
    <p>Ваш заказ будет готов в течение 20-30 минут.</p>
    <button class="btn-primary" onclick="closePopup()">Закрыть</button>
  </div>
</div>

<script>
document.getElementById('burgerForm').addEventListener('submit', function (e) {
  e.preventDefault();
  const fd = new FormData(this);
  const name = fd.get('customerName');
  if (!name.trim()) { alert('Пожалуйста, введите имя клиента'); return; }
  if (parseInt(fd.get('quantity')) < 1) { alert('Количество должно быть больше 0'); return; }
  document.getElementById('popupMessage').textContent = `Спасибо за заказ, ${name}!`;
  document.getElementById('popup').style.display = 'block';
});
function closePopup() { document.getElementById('popup').style.display = 'none'; }
function increaseQuantity() { const q = document.getElementById('quantity'); let v = parseInt(q.value) || 1; if (v < 10) q.value = v + 1; updateCounterButtons(); }
function decreaseQuantity() { const q = document.getElementById('quantity'); let v = parseInt(q.value) || 1; if (v > 1) q.value = v - 1; updateCounterButtons(); }
function updateCounterButtons() {
  const q = document.getElementById('quantity');
  let v = parseInt(q.value) || 1;
  if (v < 1) v = 1; if (v > 10) v = 10; q.value = v;
  document.querySelector('.counter-decrease').disabled = v <= 1;
  document.querySelector('.counter-increase').disabled = v >= 10;
}
function resetForm() { document.getElementById('burgerForm').reset(); document.getElementById('quantity').value = '1'; updateCounterButtons(); }
document.getElementById('popup').addEventListener('click', function (e) { if (e.target === this) closePopup(); });
document.addEventListener('DOMContentLoaded', () => {
  updateCounterButtons();
  document.getElementById('quantity').addEventListener('input', updateCounterButtons);
});
</script>
</body>
</html>
