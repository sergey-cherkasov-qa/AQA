# комент
name: QAtest

# условия запуска
on:
  push:
    branches: [main]
  pull_request: 
    branches: [main]
  workflow_dispatch:

jobs:
  myTests:
    runs-on: ubuntu-latest
    steps:
    # Поготовка среды
    - name: Checkout
      uses: actions/checkout@v7.0.1
    - name: Setup Node.js environment
      uses: actions/setup-node@v7.1.0
    # запуск тестов
    - name: Установить пакеты
      run: npm ci
    - name: Установить браузеры
      run: npx playwright install --with-deps
    - name: Запустить
      run: npm t
